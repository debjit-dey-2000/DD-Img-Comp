<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">DD Img Comp</title>
  <desc id="logo-desc">A compressed image symbol with inward arrows</desc>
  <defs>
    <linearGradient id="logo-bg" x1="9" y1="7" x2="56" y2="59" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7DD3FC"/>
      <stop offset=".46" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="logo-glass" x1="19" y1="16" x2="46" y2="46" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF" stop-opacity=".34"/>
      <stop offset="1" stop-color="#FFF" stop-opacity=".08"/>
    </linearGradient>
    <filter id="logo-shadow" x="-30%" y="-25%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#1D4ED8" flood-opacity=".34"/>
    </filter>
  </defs>

  <rect x="5" y="5" width="54" height="54" rx="18" fill="url(#logo-bg)" filter="url(#logo-shadow)"/>
  <rect x="6" y="6" width="52" height="52" rx="17" fill="none" stroke="#FFF" stroke-opacity=".2"/>
  <path d="M13 19C19 9 39 7 52 15" fill="none" stroke="#FFF" stroke-opacity=".16" stroke-width="4" stroke-linecap="round"/>

  <rect x="19" y="15" width="29" height="31" rx="8" fill="url(#logo-glass)" stroke="#FFF" stroke-opacity=".52" stroke-width="1.5" transform="rotate(5 33.5 30.5)"/>
  <rect x="16" y="17" width="31" height="30" rx="8" fill="#FFF" fill-opacity=".15" stroke="#FFF" stroke-width="2"/>
  <circle cx="25" cy="26" r="3" fill="#FFF"/>
  <path d="m19.5 41 7.6-8 5.2 5 4.5-4.5 6.7 7.5" fill="none" stroke="#FFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>

